<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: #1C6870; text-decoration: none; }
    a:hover { color: #14494F; text-decoration: underline; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #FFFFFF; color: #151A22; -webkit-font-smoothing: antialiased">

  <nav style="width: 214px; flex: none; padding: 18px 12px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid #E2E7EB">
    <span style="padding: 0 10px 22px; font-size: 17px; line-height: 1; font-weight: 600; letter-spacing: -0.024em">Atelier Nordlicht</span>
    <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 9px; border-radius: 8px; background: #F5F7F8; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; color: #626B78">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      Suchen
      <kbd style="margin-left: auto; font-family: inherit; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; color: #626B78">⌘K</kbd>
    </div>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
        Übersicht
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 8v8M13 8v5M18 8v10"></path></svg>
        Anfragen
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v12H4z"></path><path d="M9 8V5h6v3"></path><path d="M4 13h16"></path></svg>
        Projekte
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: #F0F3F5; font-weight: 600">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#151A22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"></rect><path d="M8 21h11a2 2 0 0 0 2-2V8"></path></svg>
        Galerien
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"></path><circle cx="12" cy="10" r="2.4"></circle><path d="M8.7 17c.6-1.7 1.8-2.6 3.3-2.6s2.7.9 3.3 2.6"></path></svg>
        Kontakte
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
        Kalender
      </span>
      <span style="display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 6px 10px; font-size: 13px; letter-spacing: -0.01em; background: transparent; font-weight: 400">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#626B78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        Einstellungen
      </span>
  </nav>

  <main style="min-width: 0; flex: 1">
    <div style="display: flex; align-items: center; gap: 12px; padding: 22px 32px 0">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.08; font-weight: 600; letter-spacing: -0.032em">Galerien</h1>
      <span style="margin-left: auto; display: inline-flex; align-items: center; border-radius: 999px; background: #F0F3F5; padding: 6px 14px; font-size: 12.5px; font-weight: 500; letter-spacing: -0.01em; color: #151A22">Einstellungen</span>
      <span style="display: inline-flex; align-items: center; border-radius: 999px; background: #1C6870; padding: 6px 14px; font-size: 12.5px; font-weight: 500; letter-spacing: -0.01em; color: #FFFFFF">Galerie anlegen</span>
    </div>

    <div style="max-width: 900px; padding: 28px 32px 32px">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
        <div style="display: flex; align-items: baseline; gap: 14px; padding: 12px 0; box-shadow: inset 0 1px 0 {{row.rule}}">
          <span style="min-width: 0; flex: 1; font-size: 13.5px; line-height: 1.47">
            <a href="#">{{ row.title }}</a>
            <span style="font-size: 12px; color: #626B78"> · {{ row.project }}</span>
          </span>
          <span style="width: 56px; flex: none; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: #626B78">{{ row.assets }}</span>
          <span style="width: 80px; flex: none; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: #626B78">{{ row.version }}</span>
          <span style="width: 80px; flex: none; text-align: right; font-size: 12.5px; font-variant-numeric: tabular-nums; color: #626B78">{{ row.expires }}</span>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { title: 'Lena & Jonas', project: 'Hochzeit Gut Basthorst', assets: 128, version: 'Fassung 3', expires: '12.12.26' },
      { title: 'Marie & Tim', project: 'Hochzeit Elbufer', assets: 214, version: 'Fassung 1', expires: '04.11.26' },
      { title: 'Familie Berg', project: 'Familienshooting', assets: 46, version: 'Fassung 2', expires: '—' },
      { title: 'Kontor Nord', project: 'Businessportraits', assets: 32, version: 'Fassung 1', expires: '30.09.26' },
      { title: 'Sina & Ali', project: 'Standesamt Rathaus', assets: 87, version: '—', expires: '—' },
      { title: 'Hof Wendland', project: 'Location-Bilder', assets: 61, version: 'Fassung 4', expires: '19.01.27' },
      { title: 'Anna & Piet', project: 'Verlobung Kliff', assets: 39, version: 'Fassung 1', expires: '02.10.26' },
    ].map((row, index) => ({ ...row, rule: index === 0 ? 'transparent' : '#E2E7EB' }))

    return { rows }
  }
}
</script>
</body>
</html>
