<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#FFFFFF; color:#151A22;
           font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.006em;
           -webkit-font-smoothing:antialiased; }
    * { box-sizing:border-box; }
    a { color:#151A22; text-decoration:none; }
    svg { flex:none; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .chip { display:inline-flex; align-items:center; flex:none; padding:3px 8px; border-radius:12px;
            font:600 10px/1.5 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .fbtn { appearance:none; cursor:pointer; flex:none; border:1px solid #CFD6DB; background:#FFFFFF;
            border-radius:6px; padding:7px 12px; color:#626B78;
            font:600 10.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .fbtn.on { background:#151A22; border-color:#151A22; color:#FFFFFF; }
    .entry { display:flex; align-items:baseline; gap:10px; padding:11px 0; box-shadow:inset 0 1px 0 #F0F0F2; }
    .tab { flex:none; display:flex; align-items:center; justify-content:center; position:relative;
           width:39px; height:39px; border-radius:8px; }
    .tab svg { width:17px; height:17px; stroke:#626B78; }
    .tab.on { background:#F0F3F5; }
    .tab.on svg { stroke:#151A22; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; height:844px; background:#FFFFFF">

  <div style="flex:1; min-height:0; overflow-y:auto">

    <div style="padding:16px 20px 0">
      <div style="margin-bottom:5px; font:600 11px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.05em; text-transform:uppercase; color:#626B78">Studio</div>
      <div style="display:flex; align-items:baseline; gap:10px">
        <h1 style="margin:2px 0 0; font:600 25px/1.08 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.032em">Neuigkeiten</h1>
        <span class="chip" style="margin-left:auto; background:#F0F3F5; color:#626B78">Version 0.9.1</span>
      </div>
    </div>

    <div style="display:flex; gap:8px; padding:16px 20px 0">
      <button type="button" class="fbtn {{f.alleOn}}" onClick="{{f.alle}}">Alles</button>
      <button type="button" class="fbtn {{f.neuOn}}" onClick="{{f.neu}}">Neu</button>
      <button type="button" class="fbtn {{f.fixOn}}" onClick="{{f.fix}}">Behoben</button>
    </div>

    <div style="padding:0 20px 24px">
      <sc-for list="{{versionen}}" as="v" hint-placeholder-count="2">
        <section style="margin-top:28px">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:2px">
            <h2 style="margin:0; font:600 15px/1.2 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.02em">{{v.nummer}}</h2>
            <span style="font:400 12px/1.3 'Hanken Grotesk', system-ui, sans-serif; color:#626B78; font-variant-numeric:tabular-nums">{{v.datum}}</span>
            <sc-if value="{{v.marke}}" hint-placeholder-val="{{true}}">
              <span class="chip" style="margin-left:auto; background:{{v.markeBg}}; color:{{v.markeFg}}">{{v.marke}}</span>
            </sc-if>
          </div>
          <sc-for list="{{v.zeilen}}" as="z" hint-placeholder-count="3">
            <div class="entry">
              <span class="chip" style="width:68px; justify-content:center; background:{{z.bg}}; color:{{z.fg}}">{{z.art}}</span>
              <span style="font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif">{{z.text}}</span>
            </div>
          </sc-for>
        </section>
      </sc-for>
    </div>

  </div>

  <nav style="flex:none; display:flex; justify-content:space-around; padding:6px 4px; background:#FFFFFF; box-shadow:inset 0 1px 0 #E2E7EB">
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8v8M13 8v5M18 8v10"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3"/><path d="M4 13h16"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><circle cx="12" cy="10" r="2.4"/><path d="M8.7 17c.6-1.7 1.8-2.6 3.3-2.6s2.7.9 3.3 2.6"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h3M13 14h3"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2.5h15L18 16z"/><path d="M10 19.5a2 2 0 004 0"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v11H3z"/><path d="m3 7.5 9 6 9-6"/></svg></a>
  </nav>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'alle' };
  }

  renderVals() {
    const n = (text) => ({ art: 'Neu', bg: '#EDF3EE', fg: '#3F6B4A', text });
    const f = (text) => ({ art: 'Behoben', bg: '#F0F3F5', fg: '#626B78', text });

    const versionen = [
      {
        nummer: '0.9.2', datum: '8. Sep. 2026',
        marke: 'Verfügbar', markeBg: '#FAF3E4', markeFg: '#8A6212',
        alle: [
          n('Galerie-Einstellungen liegen bei den Galerien'),
          f('Mails blieben in der Warteschlange liegen'),
        ],
      },
      {
        nummer: '0.9.1', datum: '6. Sep. 2026',
        marke: 'Installiert', markeBg: '#EDF3EE', markeFg: '#3F6B4A',
        alle: [
          n('Angebot als Regler: der Kunde stellt sein Paket selbst zusammen'),
          n('Bausteine für Angebote im Studio'),
          n('Anfragen direkt auf dem Board schließen'),
          n('Automationen für Studio und Crew an vier Ankern'),
          n('Erinnerungen für Aufgaben und Anfragen'),
          n('Erinnerungen an den Kunden'),
          n('Zahlungsverzug im Tagesüberblick'),
          n('Onboarding in zwei Schritten, Bestätigung per Link oder Code'),
          n('Steuernummer auf der Rechnung'),
          n('Neue Farben und Schrift im ganzen Studio'),
          f('Links aus dem Portal führten auf die falsche Adresse'),
          f('Buttons in Mails führten ins Leere'),
          f('Fußzeile in Mails stand mitten im Text'),
        ],
      },
      {
        nummer: '0.9.0', datum: '5. Sep. 2026',
        alle: [
          n('Anfragen-Board mit sechs Stufen'),
          n('Projekte mit Aufgaben, Terminen und Crew'),
          n('Pakete, Angebote und Verträge'),
          n('Zahlungen und Rechnungen'),
          n('Kundenportal mit eigener Galerie'),
          n('Kontakte, Kalender und Abwesenheiten'),
          n('Team mit Rollen und Rechten'),
          n('Vorlagen für Aufgaben, Formulare und Dokumente'),
        ],
      },
    ];

    const filter = this.state.filter;
    const passt = (z) => filter === 'alle'
      || (filter === 'neu' && z.art === 'Neu')
      || (filter === 'fix' && z.art === 'Behoben');

    return {
      f: {
        alle: () => this.setState({ filter: 'alle' }),
        neu: () => this.setState({ filter: 'neu' }),
        fix: () => this.setState({ filter: 'fix' }),
        alleOn: filter === 'alle' ? 'on' : '',
        neuOn: filter === 'neu' ? 'on' : '',
        fixOn: filter === 'fix' ? 'on' : '',
      },
      versionen: versionen
        .map((v) => ({ ...v, zeilen: v.alle.filter(passt) }))
        .filter((v) => v.zeilen.length > 0),
    };
  }
}
</script>
</body>
</html>
