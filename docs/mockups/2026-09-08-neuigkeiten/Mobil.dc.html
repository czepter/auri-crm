<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#FFFFFF; color:#151A22;
           font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.006em;
           -webkit-font-smoothing:antialiased; }
    * { box-sizing:border-box; }
    a { color:#151A22; text-decoration:none; }
    svg { flex:none; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .item { display:flex; align-items:center; gap:9px; margin-bottom:1px; padding:6px 10px;
            border-radius:8px; font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif;
            letter-spacing:-.01em; color:#151A22; text-decoration:none; }
    .item:hover { background:#F5F7F8; }
    .item svg { width:17px; height:17px; stroke:#626B78; }
    .item.on { background:#F0F3F5; font-weight:600; }
    .item.on svg { stroke:#151A22; }
    .item .ct { margin-left:auto; font-size:11.5px; font-variant-numeric:tabular-nums; color:#626B78; }
    .ver { display:flex; align-items:center; gap:7px; margin-bottom:6px; padding:6px 10px; border-radius:8px;
           font:400 11.5px/1 'Hanken Grotesk', system-ui, sans-serif; font-variant-numeric:tabular-nums;
           color:#626B78; text-decoration:none; }
    .ver:hover { background:#F5F7F8; color:#151A22; }
    .ver.on { background:#F0F3F5; color:#151A22; font-weight:600; }
    .chip { display:inline-flex; align-items:center; flex:none; padding:3px 8px; border-radius:12px;
            font:600 10px/1.5 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .rel { display:block; margin:0 -10px; padding:13px 10px;
           box-shadow:inset 0 1px 0 #F0F0F2; }
    .rel .top { display:flex; align-items:center; gap:10px; }
    .rel .num { font:600 14px/1.2 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.016em; }
    .rel .day { font:400 12px/1.3 'Hanken Grotesk', system-ui, sans-serif; color:#626B78;
                font-variant-numeric:tabular-nums; }
    .rel .head { margin-top:5px; font:600 14px/1.35 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.018em; }
    .cnt { display:flex; gap:14px; margin-top:5px; font:400 12.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; color:#626B78; }
    .cnt b { color:#151A22; font-weight:600; font-variant-numeric:tabular-nums; }
    .tab { flex:none; display:flex; align-items:center; justify-content:center; width:39px; height:39px; border-radius:8px; }
    .tab svg { width:17px; height:17px; stroke:#626B78; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; height:844px; background:#FFFFFF">

  <div style="flex:1; min-height:0; overflow-y:auto">

    <div style="padding:16px 20px 0">
      <div style="margin-bottom:5px; font:600 11px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.05em; text-transform:uppercase; color:#626B78">Studio</div>
      <h1 style="margin:2px 0 0; font:600 25px/1.08 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.032em">Neuigkeiten</h1>
    </div>

    <div style="padding:14px 20px 24px">
      <sc-for list="{{releases}}" as="r" hint-placeholder-count="5">
        <a href="#" class="rel">
          <div class="top">
            <span class="num">{{r.nummer}}</span>
            <span class="day">{{r.datum}}</span>
            <sc-if value="{{r.marke}}" hint-placeholder-val="{{true}}">
              <span class="chip" style="margin-left:auto; background:{{r.markeBg}}; color:{{r.markeFg}}">{{r.marke}}</span>
            </sc-if>
          </div>
          <sc-if value="{{r.headline}}" hint-placeholder-val="{{true}}">
            <div class="head">{{r.headline}}</div>
          </sc-if>
          <div class="cnt">
            <sc-for list="{{r.teile}}" as="t" hint-placeholder-count="3">
              <span><b>{{t.n}}</b> {{t.label}}</span>
            </sc-for>
          </div>
        </a>
      </sc-for>
    </div>

  </div>

  <nav style="flex:none; display:flex; justify-content:space-around; padding:6px 4px; background:#FFFFFF; box-shadow:inset 0 1px 0 #E2E7EB">
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8v8M13 8v5M18 8v10"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3"/><path d="M4 13h16"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><circle cx="12" cy="10" r="2.4"/><path d="M8.7 17c.6-1.7 1.8-2.6 3.3-2.6s2.7.9 3.3 2.6"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h3M13 14h3"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2.5h15L18 16z"/><path d="M10 19.5a2 2 0 004 0"/></svg></a>
    <a href="#" class="tab"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v11H3z"/><path d="m3 7.5 9 6 9-6"/></svg></a>
  </nav>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const VERFUEGBAR = { marke: 'Verfügbar', markeBg: '#FAF3E4', markeFg: '#8A6212' };
    const INSTALLIERT = { marke: 'Installiert', markeBg: '#EDF3EE', markeFg: '#3F6B4A' };

    const roh = [
      { nummer: '0.9.2', datum: '8. Sep. 2026', ...VERFUEGBAR, headline: 'Galerie-Einstellungen liegen bei den Galerien', feat: 1, perf: 0, fix: 2 },
      { nummer: '0.9.1', datum: '6. Sep. 2026', ...INSTALLIERT, headline: 'Das Angebot wird ein Regler', feat: 22, perf: 0, fix: 18 },
      { nummer: '0.9.0', datum: '5. Sep. 2026', headline: 'Erste Alpha: Board, Projekte, Portal', feat: 80, perf: 1, fix: 69 },
      { nummer: '0.6.0', datum: '18. Aug. 2026', headline: null, feat: 37, perf: 1, fix: 17 },
      { nummer: '0.5.0', datum: '16. Aug. 2026', headline: null, feat: 46, perf: 0, fix: 19 },
      { nummer: '0.4.0', datum: '14. Aug. 2026', headline: null, feat: 6, perf: 0, fix: 19 },
      { nummer: '0.3.0', datum: '12. Aug. 2026', headline: null, feat: 9, perf: 0, fix: 10 },
      { nummer: '0.2.0', datum: '11. Aug. 2026', headline: null, feat: 31, perf: 0, fix: 10 },
      { nummer: '0.1.0', datum: '9. Aug. 2026', headline: null, feat: 87, perf: 0, fix: 29 },
    ];

    return {
      releases: roh.map((r) => ({
        ...r,
        teile: [
          { n: r.feat, label: 'Neu' },
          { n: r.perf, label: r.perf === 1 ? 'Änderung' : 'Änderungen' },
          { n: r.fix, label: 'Behoben' },
        ].filter((t) => t.n > 0),
      })),
    };
  }
}
</script>
</body>
</html>
