<body>

<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#FFFFFF; color:#151A22;
           font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.006em;
           -webkit-font-smoothing:antialiased; }
    * { box-sizing:border-box; }
    a { color:#151A22; text-decoration:none; } a:hover { color:#151A22; }
    svg { flex:none; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .item { display:flex; align-items:center; gap:9px; margin-bottom:1px; padding:6px 10px;
            border-radius:8px; font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif;
            letter-spacing:-.01em; color:#151A22; text-decoration:none; }
    .item:hover { background:#F5F7F8; }
    .item svg { width:17px; height:17px; stroke:#626B78; }
    .item.on { background:#F0F3F5; font-weight:600; }
    .item.on svg { stroke:#151A22; }
    .item .ct { margin-left:auto; font-size:11.5px; font-variant-numeric:tabular-nums; color:#626B78; }
    .chip { display:inline-flex; align-items:center; flex:none; padding:3px 8px; border-radius:12px;
            font:600 10px/1.5 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .fbtn { appearance:none; cursor:pointer; flex:none; border:1px solid #CFD6DB; background:#FFFFFF;
            border-radius:6px; padding:5px 11px; color:#626B78;
            font:600 10.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    .fbtn:hover { border-color:#96A0AD; color:#151A22; }
    .fbtn.on { background:#151A22; border-color:#151A22; color:#FFFFFF; }
    .more { appearance:none; cursor:pointer; border:0; background:transparent; padding:10px 0 0;
            font:500 13px/1 'Hanken Grotesk', system-ui, sans-serif; color:#626B78; }
    .more:hover { color:#151A22; }
    .ver { display:flex; align-items:center; gap:7px; margin-bottom:6px; padding:6px 10px; border-radius:8px;
           font:400 11.5px/1 'Hanken Grotesk', system-ui, sans-serif; font-variant-numeric:tabular-nums;
           color:#626B78; text-decoration:none; }
    .ver:hover { background:#F5F7F8; color:#151A22; }
    .ver.on { background:#F0F3F5; color:#151A22; font-weight:600; }
    .entry { display:flex; align-items:baseline; gap:12px; padding:10px 0; box-shadow:inset 0 1px 0 #F0F0F2; }
  </style>
</helmet>

<div style="display:flex; min-height:980px; background:#FFFFFF">

    <a href="#" class="item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/></svg>Galerien</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><circle cx="12" cy="10" r="2.4"/><path d="M8.7 17c.6-1.7 1.8-2.6 3.3-2.6s2.7.9 3.3 2.6"/><path d="M6 7H3.5M6 12H3.5M6 17H3.5"/></svg>Kontakte</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Kalender</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 14h3M13 14h3M8 17h3"/></svg>Abwesenheiten</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2.5h15L18 16z"/><path d="M10 19.5a2 2 0 004 0"/></svg>Benachrichtigungen<span class="ct">3</span></a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M3 6.5h18v11H3z"/><path d="m3 7.5 9 6 9-6"/></svg>Posteingang</a>

    <div style="height:18px"></div>
    <div style="padding:0 10px 6px; font:400 10.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#626B78">Studio</div>

    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M21 8.5v7l-9 4.5-9-4.5v-7L12 4z"/><path d="M3 8.5 12 13l9-4.5M12 13v7"/></svg>Pakete</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="12" height="16" rx="2"/><path d="M8 8h4M8 12h4M19 7v12a2 2 0 0 1-2 2H8"/></svg>Vorlagen</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16.5 5.5a3.2 3.2 0 010 5.6M17.5 14.8c2 .7 3.5 2.6 3.5 5.2"/></svg>Team</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M3.5 20h17"/><path d="M7 20v-6M12 20V6M17 20v-9"/></svg>Auswertungen</a>
    <a href="#" class="item"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>Einstellungen</a>

    <div style="margin-top:auto">
      <a href="#" class="ver on"><span>v0.9.1</span><sc-if value="{{update}}" hint-placeholder-val="{{true}}"><span style="width:6px; height:6px; flex:none; border-radius:50%; background:#8A6212"></span></sc-if></a>

    <div style="display:flex; align-items:center; gap:8px; padding:10px; border-radius:8px; box-shadow:inset 0 1px 0 #E2E7EB; font:500 12.5px/1 'Hanken Grotesk', system-ui, sans-serif">
      <span style="display:flex; width:24px; height:24px; flex:none; align-items:center; justify-content:center; border-radius:50%; background:#F0F0F2; font:600 10px/1 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">CZ</span>
      <span>Christian Zepter</span>
      <svg viewBox="0 0 24 24" style="width:16px; height:16px; margin-left:auto; stroke:#626B78; stroke-width:1.75"><path d="m8 10 4-4 4 4M8 14l4 4 4-4"/></svg>
    </div>
    </div>
  </nav>

  <main style="flex:1; min-width:0; max-width:1180px">

    <div style="display:flex; align-items:center; gap:12px; padding:22px 32px 0">
      <div>
        <div style="margin-bottom:5px; font:600 11px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.05em; text-transform:uppercase; color:#626B78">Studio</div>
        <h1 style="margin:2px 0 0; font:600 32px/1.08 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.032em">Neuigkeiten</h1>
      </div>
    </div>

    <div style="display:flex; gap:8px; padding:20px 32px 0">
      <button type="button" class="fbtn {{f.alleOn}}" onClick="{{f.alle}}">Alles</button>
      <button type="button" class="fbtn {{f.neuOn}}" onClick="{{f.neu}}">Neu</button>
      <button type="button" class="fbtn {{f.fixOn}}" onClick="{{f.fix}}">Behoben</button>
    </div>

    <div style="padding:0 32px 44px">
      <sc-for list="{{versionen}}" as="v" hint-placeholder-count="3">
        <section style="display:flex; gap:24px; margin-top:36px">

          <div style="width:112px; flex:none; padding-top:5px">
            <div style="font:600 12.5px/1.2 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-.012em; color:#151A22">{{v.nummer}}</div>
            <div style="margin-top:3px; font:400 12px/1.3 'Hanken Grotesk', system-ui, sans-serif; color:#626B78; font-variant-numeric:tabular-nums">{{v.datum}}</div>
            <sc-if value="{{v.marke}}" hint-placeholder-val="{{true}}">
              <div class="chip" style="margin-top:8px; background:{{v.markeBg}}; color:{{v.markeFg}}">{{v.marke}}</div>
            </sc-if>
          </div>

          <div style="min-width:0; flex:1">
            <sc-for list="{{v.zeilen}}" as="z" hint-placeholder-count="4">
              <div class="entry">
                <span class="chip" style="width:68px; justify-content:center; background:{{z.bg}}; color:{{z.fg}}">{{z.art}}</span>
                <span style="font:400 13px/1.47 'Hanken Grotesk', system-ui, sans-serif; color:#151A22">{{z.text}}</span>
              </div>
            </sc-for>
            <sc-if value="{{v.mehr}}" hint-placeholder-val="{{true}}">
              <button type="button" class="more" onClick="{{v.umschalten}}">{{v.mehrLabel}}</button>
            </sc-if>
          </div>

        </section>
      </sc-for>
    </div>

  </main>
</div>
</x-dc>

<script data-dc-script data-props='{"update":{"editor":"boolean","default":true,"section":"Zustand"},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'alle', offen: {} };
  }

  renderVals() {
    const n = (text) => ({ art: 'Neu', bg: '#EDF3EE', fg: '#3F6B4A', text });
    const f = (text) => ({ art: 'Behoben', bg: '#F0F3F5', fg: '#626B78', text });

    const versionen = [
      {
        nummer: '0.9.2',
        datum: '8. Sep. 2026',
        marke: 'Verfügbar', markeBg: '#FAF3E4', markeFg: '#8A6212',
        alle: [
          n('Galerie-Einstellungen liegen bei den Galerien'),
          f('Mails blieben in der Warteschlange liegen'),
        ],
      },
      {
        nummer: '0.9.1',
        datum: '6. Sep. 2026',
        marke: 'Installiert', markeBg: '#EDF3EE', markeFg: '#3F6B4A',
        alle: [
          n('Angebot als Regler: der Kunde stellt sein Paket selbst zusammen'),
          n('Bausteine für Angebote im Studio'),
          n('Anfragen direkt auf dem Board schließen'),
          n('Automationen für Studio und Crew an vier Ankern'),
          n('Erinnerungen für Aufgaben und Anfragen'),
          n('Erinnerungen an den Kunden'),
          n('Zahlungsverzug im Tagesüberblick'),
          n('Onboarding in zwei Schritten, Bestätigung per Link oder Code'),
          n('Steuernummer auf der Rechnung'),
          n('Neue Farben und Schrift im ganzen Studio'),
          f('Links aus dem Portal führten auf die falsche Adresse'),
          f('Buttons in Mails führten ins Leere'),
          f('Fußzeile in Mails stand mitten im Text'),
        ],
      },
      {
        nummer: '0.9.0',
        datum: '5. Sep. 2026',
        alle: [
          n('Anfragen-Board mit sechs Stufen'),
          n('Projekte mit Aufgaben, Terminen und Crew'),
          n('Pakete, Angebote und Verträge'),
          n('Zahlungen und Rechnungen'),
          n('Kundenportal mit eigener Galerie'),
          n('Kontakte, Kalender und Abwesenheiten'),
          n('Team mit Rollen und Rechten'),
          n('Vorlagen für Aufgaben, Formulare und Dokumente'),
        ],
      },
    ];

    const KAPPE = 4;
    const filter = this.state.filter;
    const passt = (z) => filter === 'alle'
      || (filter === 'neu' && z.art === 'Neu')
      || (filter === 'fix' && z.art === 'Behoben');

    return {
      update: this.props.update ?? true,
      f: {
        alle: () => this.setState({ filter: 'alle' }),
        neu: () => this.setState({ filter: 'neu' }),
        fix: () => this.setState({ filter: 'fix' }),
        alleOn: filter === 'alle' ? 'on' : '',
        neuOn: filter === 'neu' ? 'on' : '',
        fixOn: filter === 'fix' ? 'on' : '',
      },
      versionen: versionen
        .map((v) => {
          const gefiltert = v.alle.filter(passt);
          const offen = Boolean(this.state.offen[v.nummer]);
          const kappen = !offen && gefiltert.length > KAPPE;
          return {
            ...v,
            zeilen: kappen ? gefiltert.slice(0, KAPPE) : gefiltert,
            mehr: gefiltert.length > KAPPE,
            mehrLabel: kappen ? `Alles aus ${v.nummer}` : 'Weniger',
            umschalten: () => this.setState({
              offen: { ...this.state.offen, [v.nummer]: !offen },
            }),
          };
        })
        .filter((v) => v.zeilen.length > 0),
    };
  }
}
</script>
</body>
</html>
