<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin:0; background:#FFFFFF; color:#151A22;
           font:400 15px/1.55 'Hanken Grotesk', system-ui, sans-serif;
           -webkit-font-smoothing:antialiased; }
    a { color:#151A22; text-decoration:none; }
    a:hover { color:#1C6870; }
    svg { fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
    input[type=range] { width:100%; height:44px; accent-color:#1C6870; }
    .frame { transition:opacity .28s cubic-bezier(.22,.61,.36,1), transform .28s cubic-bezier(.22,.61,.36,1); }
    .brick { transition:filter .25s ease-out, box-shadow .18s ease-out; }
    .num { font-variant-numeric:tabular-nums; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; min-height:100%; background:#FFFFFF">

  <div style="border-bottom:1px solid #E2E7EB; padding:16px 20px; display:flex; align-items:center; gap:9px">
    <i style="width:7px; height:7px; border-radius:999px; background:#1C6870; display:block"></i>
    <span style="font:600 14px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-0.012em">Atelier Nordlicht</span>
    <span style="margin-left:auto; font:400 12.5px/1 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">Lena &amp; Jonas</span>
  </div>

  <div style="{{controls}}">

    <div style="padding:24px 20px 0">
      <div style="font:600 11px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:.17em; text-transform:uppercase; color:#626B78">Angebot 2026-0042</div>

      <div style="display:flex; align-items:baseline; gap:12px; margin-top:14px">
        <div class="num" style="font:400 46px/0.94 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-0.035em">{{hours}}</div>
        <div style="font:400 16px/1.2 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">Stunden</div>
        <div class="num" style="margin-left:auto; font:600 16px/1.2 'Hanken Grotesk', system-ui, sans-serif; color:#1C6870">{{images}} Bilder</div>
      </div>

      <input type="range" min="3" max="12" step="1" value="{{hours}}" onInput="{{setHours}}">
      <div style="display:flex; justify-content:space-between; font:400 12.5px/1 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">
        <span>Standesamt · 3 Std</span>
        <span>Ganzer Tag · 12 Std</span>
      </div>

      <div style="display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:4px; margin-top:18px; height:138px; align-content:start">
        <sc-for list="{{grid}}" as="g" hint-placeholder-count="24">
          <img class="frame" src="{{g.image}}" alt="" style="{{g.style}}">
        </sc-for>
      </div>

      <div style="margin-top:10px; font:400 13.5px/1.45 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">{{shape}}</div>
    </div>

    <div style="padding:24px 20px 0; display:flex; flex-wrap:wrap; gap:7px">
      <sc-for list="{{included}}" as="i" hint-placeholder-count="3">
        <span style="display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:#F0F3F5; font:500 12.5px/1.3 'Hanken Grotesk', system-ui, sans-serif">
          <svg viewBox="0 0 24 24" style="width:12px; height:12px; color:#1C6870"><path d="M4 12.5l5 5L20 6.5"/></svg>{{i.label}}
        </span>
      </sc-for>
    </div>

    <div style="padding:26px 20px 28px">
      <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px">
        <sc-for list="{{bricks}}" as="b" hint-placeholder-count="4">
          <div class="brick" onClick="{{b.pick}}" style="{{b.style}}">
            <div style="position:relative">
              <img src="{{b.image}}" alt="" style="display:block; width:100%; height:104px; object-fit:cover">
              <div style="{{b.markStyle}}">
                <svg viewBox="0 0 24 24" style="width:13px; height:13px"><path d="M4 12.5l5 5L20 6.5"/></svg>
              </div>
            </div>
            <div style="padding:12px 14px 14px">
              <div style="font:600 14.5px/1.25 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-0.015em">{{b.name}}</div>
              <div style="font:400 12.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; color:#626B78; margin-top:3px">{{b.gives}}</div>
              <div class="num" style="{{b.priceStyle}}">{{b.price}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <div style="position:sticky; bottom:0; margin-top:auto; background:#FFFFFF; border-top:1px solid #E2E7EB; padding:14px 20px 18px">

    <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
      <div>
        <div class="num" style="font:400 34px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-0.03em">{{total}}</div>

        <div style="display:flex; gap:16px; margin-top:12px">
          <sc-for list="{{plan}}" as="s" hint-placeholder-count="3">
            <div style="flex:1; min-width:0">
              <div style="{{s.labelStyle}}">{{s.when}}</div>
              <div class="num" style="{{s.sumStyle}}">{{s.sum}}</div>
            </div>
          </sc-for>
        </div>
        <div onClick="{{accept}}" style="cursor:pointer; display:flex; align-items:center; justify-content:center; width:100%; padding:17px 24px; border-radius:999px; background:#151A22; color:#FFFFFF; font:600 15px/1 'Hanken Grotesk', system-ui, sans-serif; letter-spacing:-0.005em; margin-top:14px">Angebot annehmen</div>
      </div>
    </sc-if>

    <sc-if value="{{accepted}}" hint-placeholder-val="{{true}}">
      <div>
        <div style="display:flex; align-items:center; gap:9px; width:100%; padding:16px 18px; border-radius:14px; background:#EDF3EE; color:#3F6B4A; font:600 14.5px/1.3 'Hanken Grotesk', system-ui, sans-serif">
          <svg viewBox="0 0 24 24" style="width:16px; height:16px"><path d="M4 12.5l5 5L20 6.5"/></svg>
          Angenommen · {{total}}
        </div>
        <div style="display:flex; align-items:center; gap:14px; margin-top:10px">
          <div style="font:400 12.5px/1.4 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">Der Vertrag liegt morgen früh hier.</div>
          <div onClick="{{reopen}}" style="cursor:pointer; margin-left:auto; font:500 13.5px/1 'Hanken Grotesk', system-ui, sans-serif; color:#626B78">Ändern</div>
        </div>
      </div>
    </sc-if>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hours: 6, on: { content: true, analog: true }, accepted: false };
  }

  euro(v) {
    return v.toLocaleString('de-DE') + ' €';
  }

  catalogue() {
    return [
      { id: 'content', name: 'Content Creator', gives: 'Reels und TikToks, hochkant', price: 400, image: 'p020.jpg' },
      { id: 'analog', name: 'Analog, 35 mm', gives: 'Zwei bis drei Rollen Kodak Gold', price: 250, image: 'p011.jpg' },
      { id: 'raw', name: 'Raw Dump', gives: 'Alle Dateien, nur farbkorrigiert', price: 150, image: 'p001.jpg' },
      { id: 'album', name: 'Fine-Art-Album', gives: 'Vierzig Seiten, 30 × 30', price: 690, image: 'p016.jpg' },
    ];
  }

  /* Eine Kachel steht für zwanzig Bilder. Alle 24 bleiben im DOM, damit das
     Wachsen eine Blende ist und kein Umbau. */
  grid(hours) {
    const pool = ['p001.jpg', 'p008.jpg', 'p011.jpg', 'p016.jpg', 'p020.jpg', 'p030.jpg'];
    const live = hours * 2;
    const tiles = [];

    for (let i = 0; i < 24; i += 1) {
      const active = i < live;
      tiles.push({
        image: pool[i % pool.length],
        style: active
          ? 'width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; opacity:1; transform:scale(1)'
          : 'width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; opacity:.1; transform:scale(.86)',
      });
    }

    return tiles;
  }

  /* Prozent, aber nie unter dem Mindestbetrag der Stufe. Was die früheren
     Stufen dadurch mehr nehmen, fehlt der letzten — sie trägt den Rest, und
     eine Stufe, für die nichts übrig bleibt, entfällt.
     Die erste trägt Farbe: sie ist die einzige, die heute fällig wird. */
  stages(total) {
    const rows = [
      { when: 'Heute', percent: 25, floor: 800, accent: true },
      { when: 'Termin', percent: 50, floor: 0, accent: false },
      { when: 'Galerie', percent: 25, floor: 0, accent: false },
    ];

    let rest = total;
    const LABEL = 'font:600 10px/1 \'Hanken Grotesk\', system-ui, sans-serif; letter-spacing:.11em; text-transform:uppercase; ';
    const SUM = 'font:600 15px/1.2 \'Hanken Grotesk\', system-ui, sans-serif; margin-top:6px; ';

    return rows.map((row, index) => {
      const share = Math.round(total * row.percent / 100 / 10) * 10;
      const amount = index === rows.length - 1
        ? Math.max(0, rest)
        : Math.min(Math.max(share, row.floor), Math.max(0, rest));
      rest -= amount;

      return { ...row, amount };
    }).filter((row) => row.amount > 0).map((row) => ({
      when: row.when,
      sum: this.euro(row.amount),
      labelStyle: LABEL + (row.accent ? 'color:#1C6870' : 'color:#626B78'),
      sumStyle: SUM + (row.accent ? 'color:#1C6870' : 'color:#151A22'),
    }));
  }

  renderVals() {
    const hours = this.state.hours;
    const on = this.state.on;
    const accepted = this.state.accepted;
    const items = this.catalogue();

    const bricks = items.map((item) => {
      const active = !!on[item.id];
      return {
        name: item.name,
        gives: item.gives,
        image: item.image,
        price: '+ ' + this.euro(item.price),
        pick: accepted
          ? () => {}
          : () => this.setState({ on: { ...this.state.on, [item.id]: !this.state.on[item.id] } }),
        style: active
          ? 'cursor:pointer; border-radius:14px; overflow:hidden; background:#FFFFFF; box-shadow:0 0 0 1.5px #1C6870; filter:none'
          : 'cursor:pointer; border-radius:14px; overflow:hidden; background:#FFFFFF; box-shadow:0 0 0 1px #E2E7EB; filter:grayscale(1) contrast(.92)',
        markStyle: active
          ? 'position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:999px; background:#1C6870; color:#FFFFFF; display:flex; align-items:center; justify-content:center'
          : 'position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:999px; background:rgba(255,255,255,.82); color:transparent; display:flex; align-items:center; justify-content:center',
        priceStyle: active
          ? 'font:600 13px/1 \'Hanken Grotesk\', system-ui, sans-serif; color:#1C6870; margin-top:10px'
          : 'font:600 13px/1 \'Hanken Grotesk\', system-ui, sans-serif; color:#626B78; margin-top:10px',
      };
    });

    const chosen = items.filter((item) => on[item.id]);
    const total = hours * 250 + chosen.reduce((sum, item) => sum + item.price, 0);

    return {
      controls: accepted ? 'opacity:.45; pointer-events:none' : '',
      total: this.euro(total),
      plan: this.stages(total),
      hours,
      setHours: (event) => this.setState({ hours: Number(event.target.value) }),
      images: hours * 40,
      grid: this.grid(hours),
      shape: (hours <= 4
        ? 'Standesamt und Porträts in der Stadt'
        : (hours <= 8 ? 'Trauung, Empfang, Paarshooting' : 'Vom Ankleiden bis in die Party')) + ' · 250 € je Stunde',
      included: [
        { label: 'Fünf Bilder in 48 Stunden' },
        { label: 'Fahrt in Norddeutschland' },
        { label: 'Galerie mit Download' },
      ],
      bricks,
      open: !accepted,
      accepted,
      accept: () => this.setState({ accepted: true }),
      reopen: () => this.setState({ accepted: false }),
    };
  }
}
</script>
</body>
</html>
