services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: studio
      REDIS_HOST: redis
      # G-01a: points the `s3` disk (config/filesystems.php) at this stack's
      # `minio` service. Every one of these is an env var the disk already
      # reads for any S3-compatible endpoint — nothing here is MinIO-specific
      # except the values, the same way DB_HOST above says "postgres" without
      # the app knowing what Postgres is.
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: studio
      AWS_SECRET_ACCESS_KEY: studio-media-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media
    ports:
      # Published so the Playwright suite on the host can reach `artisan serve`
      # running inside this container. The host port is a variable because
      # several git worktrees of this repository run their own stack at once
      # and cannot all bind the same one; set APP_PORT in a root .env per
      # worktree. The container port never changes, so nothing else moves.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Runs Horizon rather than `queue:work` directly: one process supervises
  # every named-queue worker (default/mail/render, config/horizon.php) and
  # gives them the dashboard mounted on the admin surface. A queue that only
  # runs when someone remembers to start it locally is an outage waiting for
  # the first real contract, so this is a service here the same as in
  # whatever ends up running this stack in production — see docs/queue.md.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      APP_SURFACE: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: studio
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: studio
      AWS_SECRET_ACCESS_KEY: studio-media-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media
    command: php artisan horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # HTML-to-PDF, over HTTP (M-01). The only consumer is RenderContractJob,
  # which runs on the `worker` container's render queue — never the request
  # thread. Pinned to a major version rather than `:latest`, the same reason
  # every other image here names one; see GOTENBERG_URL / config/services.php
  # for how the app finds it, and app/Contracts/Support/GotenbergClient.php
  # for the one place that calls it.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (G-01a), local stand-in for whichever
  # provider a deploy chooses — MinIO here, RustFS, IONOS Object Storage and
  # Hetzner Object Storage all equally valid (config/filesystems.php's `s3`
  # disk names none of them).
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studio-media-secret
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once, on every `docker compose up`, and exits: creates the `media`
  # bucket the `s3` disk expects (AWS_BUCKET) if it doesn't exist yet. The
  # official minio/minio image has no "create this bucket on boot" env var of
  # its own — mc is the documented way to script one against a running
  # server.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 studio studio-media-secret &&
      mc mb --ignore-existing local/media
      "
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
  composer-cache:
