services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      # F-11: baked into the image as SENTRY_RELEASE so GlitchTip can
      # attribute an error to the deploy that shipped it. Unset by default —
      # local `docker compose build` never passes GIT_SHA, so the image
      # carries no release and SENTRY_RELEASE stays empty, same as
      # SENTRY_LARAVEL_DSN below.
      args:
        GIT_SHA: ${GIT_SHA:-}
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment: &studio-environment
      COMPOSER_HOME: /tmp/composer
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: studio
      REDIS_HOST: redis
      # G-01a: points the `s3` disk (config/filesystems.php) at this stack's
      # `minio` service. Every one of these is an env var the disk already
      # reads for any S3-compatible endpoint — nothing here is MinIO-specific
      # except the values, the same way DB_HOST above says "postgres" without
      # the app knowing what Postgres is.
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: studio
      AWS_SECRET_ACCESS_KEY: studio-media-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media
      # The portal answers on its own port here, so the admin surface cannot
      # let config/portal.php fall back to its own APP_URL — that composes
      # /zugang/{token} onto :8000, where the portal routes do not exist.
      # docker-compose.coolify.yml sets the deployed equivalent.
      PORTAL_URL: http://localhost:${PORTAL_PORT:-8001}
      # config/services.php's `gallery.url` — apps/gallery, the guest viewer,
      # on its own port here for the same reason PORTAL_URL is: without it,
      # Gallery::publicUrl() falls back to its config default
      # (http://localhost:4321), which happens to match this stack's own
      # default GALLERY_PORT but would be silently wrong the moment either
      # port is overridden. docker-compose.coolify.yml sets the deployed
      # equivalent from ${SERVICE_FQDN_GALLERY_4321}.
      GALLERY_URL: http://localhost:${GALLERY_PORT:-4321}
      # F-11: empty by default, same as apps/studio/.env.example — the SDK
      # stays fully inert (config/sentry.php) until a developer opts in by
      # setting this in their own shell or root .env, e.g. to
      # http://localhost:${GLITCHTIP_PORT:-8080}/<project-dsn-path> once a
      # project exists on the glitchtip-web service below to test against.
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      # The `mailpit` service below is the only SMTP host this stack has, and
      # nothing pointed at it: apps/studio/.env.example ships Laravel's
      # MAIL_MAILER=log, and docker/php/Dockerfile — unlike the production
      # image (docker/app/Dockerfile) — bakes no mail defaults. Every mail the
      # app sends locally went to the log file instead, so the inbox at
      # http://localhost:8025 stayed empty and no rendered mail was ever seen.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # E-12: without a domain InboundAddress::configured() holds the whole
      # inbound path inert, so neither the inbox screen nor the
      # /mail/eingang webhook can be exercised in this stack. IMAP stays
      # unset: mailpit speaks SMTP and HTTP, it is no mailbox to poll — the
      # webhook adapter is the local way in.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN:-inbound.localhost}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET:-local-inbound-secret}
      # #357: the `mercure` service below. The browser reaches it on its own
      # port, which is why the public URL is absolute here and a bare path in
      # a deploy, where the admin container serves the hub itself.
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:${MERCURE_PORT:-3001}/.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-publisher-key
      MERCURE_SUBSCRIBER_JWT_KEY: local-mercure-subscriber-key
    ports:
      # Published so the Playwright suite on the host can reach `artisan serve`
      # running inside this container. The host port is a variable because
      # several git worktrees of this repository run their own stack at once
      # and cannot all bind the same one; set APP_PORT in a root .env per
      # worktree. The container port never changes, so nothing else moves.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Runs Horizon rather than `queue:work` directly: one process supervises
  # every named-queue worker (default/mail/render, config/horizon.php) and
  # gives them the dashboard mounted on the admin surface. A queue that only
  # runs when someone remembers to start it locally is an outage waiting for
  # the first real contract, so this is a service here the same as in
  # whatever ends up running this stack in production — see docs/queue.md.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      APP_SURFACE: admin
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: studio
      DB_USERNAME: studio
      DB_PASSWORD: studio
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: studio
      AWS_SECRET_ACCESS_KEY: studio-media-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media
      # RenderInvoiceJob and EnsureContractArtifact resolve
      # DocumentMergeDataBuilder's {{gallery.link}} on this queue — same
      # reasoning as the php service's own GALLERY_URL, not inherited here
      # since this block predates the anchor and repeats it by hand.
      GALLERY_URL: http://localhost:${GALLERY_PORT:-4321}
      # A quiet-hours DeferredNotification re-renders QuoteSent on the `mail`
      # queue, so this container composes portal links too — same reasoning as
      # GALLERY_URL above, and as the php service's own PORTAL_URL.
      PORTAL_URL: http://localhost:${PORTAL_PORT:-8001}
      # F-11: a failed job on this container's default/mail/render
      # supervisors (config/horizon.php) reports here too — same DSN, same
      # empty-by-default rule as the php service above.
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      # The `mail` queue supervisor runs here, so this is the container that
      # actually hands a message to an MTA — same reasoning as the php
      # service's own MAIL_* block, not inherited since this one repeats the
      # anchor by hand.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # E-12: IngestInboundMessage runs on this container's supervisors and
      # mints reply addresses under the domain.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN:-inbound.localhost}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET:-local-inbound-secret}
      # #357: renders and ingests finish here, and an open tab should see them.
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-publisher-key
    command: php artisan horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # One image, three surfaces, three containers — the same shape the deploy
  # runs (docker-compose.coolify.yml). APP_SURFACE decides which route file
  # boots (App\Support\Surface, config/surface.php), so the admin routes being
  # unreachable from a client session is enforced by their absence from this
  # container rather than by middleware that could be misconfigured. Running
  # them side by side locally is what makes that seam testable at all: a route
  # that leaked across surfaces shows up as a 200 on the wrong port.
  #
  # `php` above stays the toolbox container (artisan, composer, pest — no
  # long-running command of its own); these two serve.
  portal:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      <<: *studio-environment
      APP_SURFACE: portal
      APP_URL: http://localhost:${PORTAL_PORT:-8001}
    # --no-reload because `artisan serve` otherwise hands the php -S child
    # only ServeCommand::$passthroughVariables and drops the rest, leaving
    # apps/studio/.env — one file for all three surfaces — as the only APP_URL
    # a request ever sees. Every link this surface mails would carry the
    # admin's host. Nothing is lost: the built-in server re-reads .env per
    # request anyway, so only the watcher goes.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Carries routes/api.php, and with it both the Stripe webhook and the read
  # routes the gallery below renders against.
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    working_dir: /app/apps/studio
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      <<: *studio-environment
      APP_SURFACE: api
      APP_URL: http://localhost:${API_PORT:-8002}
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "127.0.0.1:${API_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The guest-facing Astro SSR gallery (apps/gallery), in `astro dev` rather
  # than the built image the deploy runs: source is bind-mounted, so HMR works
  # the same way `pnpm --filter @studio/app dev` does for the admin bundle.
  #
  # It reaches Laravel over the api surface two ways, and both are needed.
  # API_URL is container to container, for what this process fetches while
  # rendering. PUBLIC_API_URL is what ends up in the HTML — every <img src>
  # points at the image proxy, and the detail view's hearts and comments are
  # browser calls — so it has to be an address a guest's browser can actually
  # resolve. One value for both is why images never loaded in dev.
  #
  # The page cannot be prerendered because which GalleryVersion is current
  # changes the moment a studio owner republishes (astro.config.mjs).
  gallery:
    image: node:24-slim
    working_dir: /app/apps/gallery
    volumes:
      - .:/app
      # Anonymous volumes, shadowing whatever the host installed: pnpm resolves
      # optional native binaries per platform (rollup, esbuild), and this repo
      # is checked out on macOS — the darwin-arm64 build the host has is not
      # loadable in here. These keep the container's own linux install separate
      # rather than overwriting the host's, which would break `pnpm dev` on the
      # host the moment this service ran once.
      - /app/node_modules
      - /app/apps/gallery/node_modules
      # Same shadowing, for the same reason: `astro dev` writes the running
      # server's pid to .astro/dev.json, and on the host bind mount that file
      # outlives the container it describes. The next container then finds a
      # pid that resolves to something else in its own namespace, decides a dev
      # server is already running, and refuses to start.
      - /app/apps/gallery/.astro
      - pnpm-store:/pnpm-store
    environment:
      npm_config_store_dir: /pnpm-store
      API_URL: http://api:8000
      PUBLIC_API_URL: http://localhost:${API_PORT:-8002}
      # Der Download liegt im Portal, nicht hier: dort stehen die PIN, die
      # Adressprüfung und die ZIP-Bände. Ohne diese Adresse zeigte der Knopf
      # im Betrachter auf einen Pfad, den dieser Host nicht kennt.
      PUBLIC_PORTAL_URL: http://localhost:${PORTAL_PORT:-8001}
      # F-11/G-13: empty leaves the SSR process fully inert — no outbound calls
      # at all — same empty-by-default rule as SENTRY_LARAVEL_DSN above.
      SENTRY_DSN: ${GALLERY_SENTRY_DSN:-}
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile --filter @studio/gallery &&
      pnpm --filter @studio/gallery dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:${GALLERY_PORT:-4321}:4321"
    depends_on:
      - api

  # HTML-to-PDF, over HTTP (M-01). The only consumer is RenderContractJob,
  # which runs on the `worker` container's render queue — never the request
  # thread. Pinned to a major version rather than `:latest`, the same reason
  # every other image here names one; see GOTENBERG_URL / config/services.php
  # for how the app finds it, and app/Contracts/Support/GotenbergClient.php
  # for the one place that calls it.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # #357: the hub a deploy runs inside the admin container
  # (docker/app/mercure.caddy). Locally the surfaces run `artisan serve`,
  # which carries none, so it stands alone.
  mercure:
    image: dunglas/mercure:v0.21
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: local-mercure-publisher-key
      MERCURE_SUBSCRIBER_JWT_KEY: local-mercure-subscriber-key
      # The admin screen is another origin here, one port over.
      MERCURE_EXTRA_DIRECTIVES: cors_origins http://localhost:${APP_PORT:-8000}
    ports:
      - "127.0.0.1:${MERCURE_PORT:-3001}:80"

  # F-11: self-hosted GlitchTip — Sentry-protocol-compatible error tracking
  # (sentry/sentry-laravel, config/sentry.php) on our own Postgres rather
  # than Sentry's hosted service, so it's one fewer DSGVO processor rather
  # than one more. Split into its own web + worker services rather than the
  # single all_in_one container GlitchTip's own sample compose defaults to
  # (see https://glitchtip.com/documentation/install), the same shape as
  # this stack's own `php` + `worker` pair just above: one image, one
  # command override for the worker. Nothing here gates `php`/`worker`
  # startup (SENTRY_LARAVEL_DSN empty means the SDK never calls out at all —
  # see config/sentry.php), so neither depends_on's a GlitchTip healthcheck.
  glitchtip-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once, on every `docker compose up`, and exits — same "migrate
  # before anything queries the schema" shape as minio-init below, and
  # necessary for the same reason: GlitchTip's own image only migrates
  # itself automatically under Heroku's DYNO convention (bin/start.sh), which
  # a plain Compose deployment never sets. Without this, glitchtip-worker's
  # first Celery beat tick fails outright — the schema doesn't exist yet.
  glitchtip-migrate:
    image: glitchtip/glitchtip:6
    command: ./manage.py migrate
    environment: &glitchtip-environment
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      # Reuses this stack's own `redis` service (Celery broker + cache)
      # rather than standing up a second Redis just for GlitchTip — db 1
      # keeps its keyspace apart from the app's own (db 0).
      VALKEY_URL: redis://redis:6379/1
      SECRET_KEY: glitchtip-local-dev-secret-key-do-not-use-in-production
      # console-only: nothing in this story needs GlitchTip to actually
      # deliver mail (issue notifications, invites), only to receive errors.
      EMAIL_URL: "consolemail://"
      DEFAULT_FROM_EMAIL: glitchtip@studio.test
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_PORT:-8080}
      ENABLE_ORGANIZATION_CREATION: "True"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip:6
    environment: *glitchtip-environment
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8080}:8000"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  glitchtip-worker:
    image: glitchtip/glitchtip:6
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-environment
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # S3-compatible object storage (G-01a), local stand-in for whichever
  # provider a deploy chooses — MinIO here, RustFS, IONOS Object Storage and
  # Hetzner Object Storage all equally valid (config/filesystems.php's `s3`
  # disk names none of them).
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studio-media-secret
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once, on every `docker compose up`, and exits: creates the `media`
  # bucket the `s3` disk expects (AWS_BUCKET) if it doesn't exist yet. The
  # official minio/minio image has no "create this bucket on boot" env var of
  # its own — mc is the documented way to script one against a running
  # server.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 studio studio-media-secret &&
      mc mb --ignore-existing local/media
      "
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
  glitchtip-pgdata:
  composer-cache:
  pnpm-store:
