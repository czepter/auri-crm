services:
  admin:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_ADMIN_8080:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_ADMIN}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_URL_RUSTFS}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      GALLERY_URL: ${SERVICE_URL_GALLERY}
      API_URL: ${SERVICE_FQDN_API}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS}
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
      RELEASE_LOG_URL: ${RELEASE_LOG_URL:-https://uew53y9iuh4kievlxtcshuyc.coolify3.czpt.de}
      CADDY_SERVER_EXTRA_DIRECTIVES: import /etc/frankenphp/mercure.caddy
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      MERCURE_SUBSCRIBER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCURESUB}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  portal:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_PORTAL_8080:
      APP_SURFACE: portal
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      APP_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_URL_RUSTFS}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      GALLERY_URL: ${SERVICE_URL_GALLERY}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  api:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_API_8080:
      APP_SURFACE: api
      APP_URL: ${SERVICE_FQDN_API}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_URL_RUSTFS}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      ADMIN_URL: ${SERVICE_FQDN_ADMIN}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS}
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  gallery:
    image: ghcr.io/czepter/auri-crm/gallery:${VERSION}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_GALLERY_4321:
      API_URL: http://api:8080
      PUBLIC_API_URL: ${SERVICE_URL_API}
      SENTRY_DSN: ${GALLERY_SENTRY_DSN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  horizon:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: unless-stopped
    command: php artisan horizon
    stop_grace_period: 60s
    mem_limit: 1g
    environment:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_ADMIN}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      GALLERY_URL: ${SERVICE_URL_GALLERY}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS}
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: unless-stopped
    command: php artisan schedule:work
    healthcheck:
      disable: true
    environment:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_ADMIN}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS}
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
      RELEASE_LOG_URL: ${RELEASE_LOG_URL:-https://uew53y9iuh4kievlxtcshuyc.coolify3.czpt.de}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/czepter/auri-crm/studio:${VERSION}
    restart: "no"
    command: php artisan migrate --force --isolated
    environment:
      APP_SURFACE: admin
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    environment:
      CHROMIUM_MAX_CONCURRENCY: "2"
      CHROMIUM_MAX_QUEUE_SIZE: "8"
      CHROMIUM_RESTART_AFTER: "10"
      LIBREOFFICE_DISABLE_ROUTES: "true"
      PDFENGINES_DISABLE_ROUTES: "true"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    restart: unless-stopped
    environment:
      SERVICE_URL_RUSTFS_9000:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSKEY}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-init:
    image: amazon/aws-cli:2.37.1
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_BUCKET: ${AWS_BUCKET:-studio}
    entrypoint: >
      sh -c 'aws s3api head-bucket --bucket "$$AWS_BUCKET" || aws s3api create-bucket --bucket "$$AWS_BUCKET"'
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rustfsdata:
