services:
  admin:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_ADMIN_8080:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_ADMIN}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      GALLERY_URL: ${SERVICE_FQDN_GALLERY_4321}
      API_URL: ${SERVICE_FQDN_API}
      MCP_URL: ${SERVICE_FQDN_MCP}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      # E-12: the inbox reads config('mail.inbound.domain') to show the
      # catch-all address; unset, InboundAddress::configured() reports none.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
      RELEASE_LOG_URL: ${RELEASE_LOG_URL:-https://uew53y9iuh4kievlxtcshuyc.coolify3.czpt.de}
      # #357: this container carries the Mercure hub (docker/app/mercure.caddy);
      # every other studio container publishes to it at MERCURE_URL, which the
      # image bakes.
      CADDY_SERVER_EXTRA_DIRECTIVES: import /etc/frankenphp/mercure.caddy
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      MERCURE_SUBSCRIBER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCURESUB}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  portal:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_PORTAL_8080:
      APP_SURFACE: portal
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      APP_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      GALLERY_URL: ${SERVICE_FQDN_GALLERY_4321}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  api:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_API_8080:
      APP_SURFACE: api
      APP_URL: ${SERVICE_FQDN_API}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      # This surface raises notifications of its own — PublicInquiryController
      # -> LeadCaptured -> InquiryReceived is the studio's only word that a
      # lead arrived, and the Stripe webhook above raises InstallmentPaid the
      # same way. SendMailNotification carries every one of them to horizon,
      # so the DSN here is what keeps that true of a deploy that ever runs
      # the queue synchronously rather than a promise the code makes.
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      # E-12: InboundMailController verifies the webhook against the signing
      # secret, and refuses every delivery without it.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  gallery:
    image: ghcr.io/czepter/auri-crm/gallery:v0.9.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_GALLERY_4321:
      API_URL: http://api:8080
      PUBLIC_API_URL: ${SERVICE_FQDN_API}
      SENTRY_DSN: ${GALLERY_SENTRY_DSN}
    # Any response, not a 2xx: the only route is /g/:galleryId, so every probe
    # path 404s and --fail would report a healthy server as down forever.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  # N-04: the MCP HTTP transport, the one service here a third party connects
  # to directly — claude.ai adds this FQDN as a connector and runs the OAuth
  # flow against admin. Its own domain because that is what "resource" means
  # in the metadata document it serves; CRM_API_BASE_URL stays internal
  # because only this container calls it.
  mcp:
    image: ghcr.io/czepter/auri-crm/mcp:v0.9.0
    restart: unless-stopped
    environment:
      SERVICE_FQDN_MCP_3000:
      MCP_PUBLIC_URL: ${SERVICE_FQDN_MCP}
      OAUTH_ISSUER_URL: ${SERVICE_FQDN_ADMIN}
      CRM_API_BASE_URL: http://api:8080/api
      # F-11: a protocol error here never throws — the SDK answers it with a
      # 400 body and calls onerror — so this DSN is the only way a rejected
      # handshake is ever seen. The healthcheck below cannot see one: it reads
      # the metadata document, which is served in front of the whole gate.
      SENTRY_DSN: ${MCP_SENTRY_DSN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/.well-known/oauth-protected-resource').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

  horizon:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: unless-stopped
    command: php artisan horizon
    stop_grace_period: 60s
    environment:
      APP_SURFACE: admin
      # This container's own surface, like every other service here: StudioDigest
      # links /benachrichtigungen, an admin route, and renders on this queue.
      # Links onto the other surfaces name their host below.
      APP_URL: ${SERVICE_FQDN_ADMIN}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      GALLERY_URL: ${SERVICE_FQDN_GALLERY_4321}
      # QuoteSent composes portal links here whenever quiet hours defer the
      # send, and APP_URL above is the studio — config/portal.php's fallback
      # would aim them at the wrong surface.
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      # E-12: IngestInboundMessage runs here, and E-11 takes the domain half
      # of every outgoing Message-ID from the inbound domain.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: unless-stopped
    command: php artisan schedule:work
    # No web server in this container, so the HTTP probe baked into the image
    # would fail forever. schedule:work is PID 1: if it dies, so does the
    # container, and restart brings it back.
    healthcheck:
      disable: true
    environment:
      APP_SURFACE: admin
      # Admin, and the portal named separately — same reasoning as horizon.
      # notifications:send-digests sends StudioDigest inline from here whenever
      # quiet hours do not defer it to that queue.
      APP_URL: ${SERVICE_FQDN_ADMIN}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Studio}
      # E-12: PollInboundMailbox runs on this schedule and needs the IMAP
      # credentials of the catch-all mailbox.
      MAIL_INBOUND_DOMAIN: ${MAIL_INBOUND_DOMAIN}
      MAIL_INBOUND_AUTHSERV_ID: ${MAIL_INBOUND_AUTHSERV_ID}
      MAIL_INBOUND_MAX_BYTES: ${MAIL_INBOUND_MAX_BYTES:-26214400}
      MAIL_INBOUND_IMAP_HOST: ${MAIL_INBOUND_IMAP_HOST}
      MAIL_INBOUND_IMAP_PORT: ${MAIL_INBOUND_IMAP_PORT:-993}
      MAIL_INBOUND_IMAP_ENCRYPTION: ${MAIL_INBOUND_IMAP_ENCRYPTION:-ssl}
      MAIL_INBOUND_IMAP_VALIDATE_CERT: ${MAIL_INBOUND_IMAP_VALIDATE_CERT:-true}
      MAIL_INBOUND_IMAP_USERNAME: ${MAIL_INBOUND_IMAP_USERNAME}
      MAIL_INBOUND_IMAP_PASSWORD: ${MAIL_INBOUND_IMAP_PASSWORD}
      MAIL_INBOUND_IMAP_FOLDER: ${MAIL_INBOUND_IMAP_FOLDER:-INBOX}
      MAIL_INBOUND_SIGNING_SECRET: ${MAIL_INBOUND_SIGNING_SECRET}
      RELEASE_LOG_URL: ${RELEASE_LOG_URL:-https://uew53y9iuh4kievlxtcshuyc.coolify3.czpt.de}
      MERCURE_PUBLISHER_JWT_KEY: ${SERVICE_PASSWORD_64_MERCUREPUB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/czepter/auri-crm/studio:v0.9.0
    restart: "no"
    command: php artisan migrate --force --isolated
    environment:
      APP_SURFACE: admin
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # Only /forms/chromium/convert/html is ever called (App\Support\GotenbergClient),
    # and supervisor-render runs one process (config/horizon.php), so the stock
    # six parallel Chromium instances are five more than this stack can use.
    environment:
      CHROMIUM_MAX_CONCURRENCY: "2"
      CHROMIUM_MAX_QUEUE_SIZE: "8"
      CHROMIUM_RESTART_AFTER: "10"
      LIBREOFFICE_DISABLE_ROUTES: "true"
      PDFENGINES_DISABLE_ROUTES: "true"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    restart: unless-stopped
    environment:
      SERVICE_FQDN_RUSTFS_9000:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSKEY}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    command: ["/data"]
    # RustFS serves MinIO's health path — the same one docker-compose.yml probes
    # against MinIO, so both stacks gate storage on one endpoint.
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSKEY}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
    entrypoint: >
      sh -c '
        until mc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo "waiting for rustfs"; sleep 2;
        done;
        mc mb --ignore-existing rustfs/"$$AWS_BUCKET"
      '
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rustfsdata:
