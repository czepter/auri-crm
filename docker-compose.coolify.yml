services:
  admin:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: unless-stopped
    environment:
      SERVICE_FQDN_ADMIN_8080:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_ADMIN}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      PORTAL_URL: ${SERVICE_FQDN_PORTAL}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  portal:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: unless-stopped
    environment:
      SERVICE_FQDN_PORTAL_8080:
      APP_SURFACE: portal
      APP_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  api:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: unless-stopped
    environment:
      SERVICE_FQDN_API_8080:
      APP_SURFACE: api
      APP_URL: ${SERVICE_FQDN_API}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: ${SERVICE_FQDN_RUSTFS}
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  gallery:
    image: ghcr.io/czepter/auri-crm/gallery:latest
    restart: unless-stopped
    environment:
      SERVICE_FQDN_GALLERY_4321:
      API_URL: http://api:8080
      PUBLIC_API_URL: ${SERVICE_FQDN_API}
      SENTRY_DSN: ${GALLERY_SENTRY_DSN}
    depends_on:
      api:
        condition: service_healthy

  horizon:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: unless-stopped
    command: php artisan horizon
    stop_grace_period: 60s
    environment:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_SURFACE: admin
      APP_URL: ${SERVICE_FQDN_PORTAL}
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
      AWS_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${SERVICE_PASSWORD_RUSTFSKEY}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      MAIL_URL: ${MAIL_URL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/czepter/auri-crm/studio:latest
    restart: "no"
    command: php artisan migrate --force --isolated
    environment:
      APP_SURFACE: admin
      APP_KEY: ${SERVICE_REALBASE64_APPKEY}
      SENTRY_LARAVEL_DSN: ${STUDIO_SENTRY_DSN}
      DB_DATABASE: ${POSTGRES_DB:-studio}
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.1
    restart: unless-stopped
    environment:
      SERVICE_FQDN_RUSTFS_9000:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSKEY}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    command: ["/data"]

  rustfs-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${SERVICE_PASSWORD_RUSTFSKEY}
      RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFSSECRET}
      AWS_BUCKET: ${AWS_BUCKET:-studio}
    entrypoint: >
      sh -c '
        until mc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"; do
          echo "waiting for rustfs"; sleep 2;
        done;
        mc mb --ignore-existing rustfs/"$$AWS_BUCKET"
      '
    depends_on:
      - rustfs

volumes:
  pgdata:
  redisdata:
  rustfsdata:
