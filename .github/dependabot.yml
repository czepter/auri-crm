version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /docker/app
      - /docker/gallery
      - /docker/php
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /apps/studio
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]
