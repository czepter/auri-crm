name: Release images

# Builds the deployment images ahead of the deploy rather than on the server.
# docker-compose.coolify.yml names seven services off two images; letting
# Coolify build them would mean a VPS compiling PHP extensions and two
# JavaScript bundles while the old containers are still serving, on hardware
# sized for neither. Here the build is already cached, already tested by ci.yml
# on the same commit, and the deploy is a pull.
on:
  # A published release is what names a deployable version, and the only
  # build production pulls. A push to main used to build too: the same commit
  # twice per release, and the self-hosted runners share a host whose memory
  # two overlapping builds exhaust. A branch image for staging is a manual
  # workflow_dispatch.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, and it guards the failure mode nothing else would catch: every rule
  # it checks produces a stack that deploys green with an empty secret or a
  # misrouted domain. Its own job so the matrix below does not run it twice.
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      # In a container, not the host's PHP: ci.yml says why.
      - name: Check the Compose file against Coolify's parser rules
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo php:8.5-cli php docker/app/check-coolify-compose.php

  build:
    needs: check
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Six of the seven app services run this one: three HTTP surfaces,
          # Horizon, the scheduler and the migration one-shot.
          - image: studio
            dockerfile: docker/app/Dockerfile
          - image: gallery
            dockerfile: docker/gallery/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-compose.coolify.yml names a version tag, so `v0.9.0` on a
      # release is what production pulls. `latest` follows the newest release
      # and nothing else — `{{is_default_branch}}` would put it on every push
      # to `dev` (this repo's default branch), and it evaluates to true on a
      # tag ref as well, so it moved on both. Every build also gets its branch
      # name and its commit SHA; the SHA names one specific build forever.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SENTRY_RELEASE tags a GlitchTip event with the build it came from,
          # so it is the commit. APP_VERSION is what the running app calls
          # itself: the release tag where there is one, otherwise the branch —
          # `github.event.release.tag_name` is empty on a dispatch and falls
          # through, so a branch build reads `dev` — which config/app.php
          # documents as not being a version at all.
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            APP_VERSION=${{ github.event.release.tag_name || github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
