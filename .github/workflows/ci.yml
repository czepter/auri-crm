name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# The default GITHUB_TOKEN grants contents:read only, and dorny/paths-filter
# asks the API which files a pull request touches — without pull-requests:read
# it fails with "Resource not accessible by integration", the changes job dies,
# and every test job silently skips on its `needs` output. A green checkmark
# over an untested pull request is worse than a red one.
permissions:
  contents: read
  pull-requests: read
  # already-green asks the API for this workflow's own earlier runs. Without
  # actions:read it finds none, never skips, and costs a job to say so.
  actions: read

# Supersede in-flight runs for the same PR/branch. Pushes to the integration
# branches are never cancelled so every commit there keeps a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One change is tested up to four times: the pull request into dev, the push
  # that merge makes on dev, the pull request from dev into main, and that
  # merge's push on main. The tree is identical across those whenever the base
  # has not moved in between, and this job is what notices. A moved base, or an
  # edit to this file, changes the tree and everything runs again.
  #
  # Skipping leaves studio/web/e2e reported as skipped, which branch protection
  # counts as passing — the same thing the `changes` gate below already relies
  # on.
  already-green:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.probe.outputs.should_skip }}
    steps:
      # Pinned to the commit behind v5.3.2 rather than the tag: a tag on a
      # third-party repository can be moved onto other code, and this one runs
      # before every test job.
      - id: probe
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578

  # Enforces the branching model documented in docs/branching.md:
  # feature/bugfix -> dev -> main. Deliberately has no `needs`, so it reports
  # a verdict even while the test jobs are still running.
  branch-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request base and head branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)
              case "$HEAD" in
                dev | hotfix/* | release/*) ;;
                *)
                  echo "::error::main only accepts dev, hotfix/* or release/*, but this pull request comes from '$HEAD'. Retarget it at dev."
                  exit 1
                  ;;
              esac
              ;;
            dev)
              case "$HEAD" in
                feat/* | feature/* | fix/* | bugfix/* | hotfix/* | chore/* | docs/* | refactor/* | ci/* | test/*) ;;
                *)
                  echo "::error::Branches merged into dev must be named <type>/<slug>, one of feat feature fix bugfix hotfix chore docs refactor ci test. Got '$HEAD'."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Base branch '$BASE' is not an integration branch; stacked branches are unrestricted."
              ;;
          esac
          echo "OK: $HEAD -> $BASE"

  changes:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            php: &php
              - *ci
              - 'apps/studio/app/**'
              - 'apps/studio/bootstrap/**'
              - 'apps/studio/config/**'
              - 'apps/studio/database/**'
              - 'apps/studio/routes/**'
              - 'apps/studio/tests/**'
              - 'apps/studio/composer.json'
              - 'apps/studio/composer.lock'
              - 'apps/studio/phpunit.xml'
              - 'apps/studio/artisan'
              - 'apps/studio/.env.example'
              - 'apps/studio/resources/js/types/generated.d.ts'
              - 'apps/studio/resources/mail/**'
              - 'apps/studio/resources/views/vendor/mail/**'
              # G-01: the committed OpenAPI document is derived from the api
              # surface's routes, so a hand-edit here — without the route
              # change that should have produced it — needs the same
              # drift check a php-only change already gets below.
              - 'packages/contracts/**'
            web: &web
              - *ci
              - 'apps/studio/resources/**'
              - 'apps/studio/public/**'
              - 'apps/studio/*.ts'
              - 'apps/studio/*.json'
              # G-08: the Astro gallery viewer, its own workspace package —
              # `pnpm -r --if-present <script>` (package.json's own lint/
              # test/build) already picks it up once pnpm sees it change.
              - 'apps/gallery/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            e2e:
              - *php
              - *web

  studio:
    needs: [changes, already-green]
    if: needs.changes.outputs.php == 'true' && needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # T-01's cross-process cache test is the first to need this: it proves
      # a setting changed by one StudioSettingsResolver instance is visible
      # to a completely fresh one through the redis cache store, which means
      # nothing unless a real Redis sits behind it. .env.example's own
      # REDIS_HOST (127.0.0.1) already matches where a service container
      # publishes to on the runner, so no env override is needed below.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, bcmath, gd, intl, pcntl, exif
          coverage: none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @studio/app
      # X-03's db:cutover-snapshot/db:cutover-restore shell out to pg_dump/
      # pg_restore, and CutoverRehearsalTest exercises them for real — the
      # runner's default postgresql-client doesn't match the postgres:18
      # service above closely enough, so install the matching major version
      # from PGDG rather than trusting whatever Ubuntu ships.
      - name: Install postgresql-client matching the service container
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # PGDG's 18.6 upload moved /usr/bin/pg_config into libpq-dev, which
          # collides with the postgresql-common the runner image already has.
          # Nothing here compiles against libpq, so drop the -dev package
          # instead of force-overwriting a file another package owns.
          sudo apt-get remove -y libpq-dev
          sudo apt-get install -y postgresql-client-18
      # G-03 (#52): App\Media\Support\LibvipsDerivativePipeline shells out to
      # vipsthumbnail/vipsheader — a CLI tool, not a PHP extension, so it's
      # never in setup-php's list above. Same pattern as postgresql-client
      # just above: this runner's apt repos carry it directly, no PPA needed.
      # libheif-plugin-aomenc: the runner's libheif1 has no AV1 encoder linked
      # in by default — heifsave fails "Unsupported compression" on every
      # AVIF write without it.
      - name: Install libvips-tools for derivative generation
        run: sudo apt-get install -y libvips-tools libheif-plugin-aomenc
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      - working-directory: apps/studio
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          ./vendor/bin/pest
      - name: Assert the generated TypeScript types are current
        working-directory: apps/studio
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/js/types/generated.d.ts \
            || { echo "Generated types are stale. Run 'php artisan typescript:transform' and commit."; exit 1; }
      # G-01: packages/contracts/openapi.json is generated, never hand-edited
      # — Dedoc Scramble introspects the api surface's routes directly, so
      # regenerating it here and diffing against what's committed is the same
      # drift check the TypeScript types get above, for the same reason: a
      # contract nothing regenerated is a contract nobody can trust.
      - name: Assert the OpenAPI contract is current
        working-directory: apps/studio
        env:
          APP_SURFACE: api
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
        run: |
          php artisan scramble:export --path=../../packages/contracts/openapi.json
          git diff --exit-code -- ../../packages/contracts/openapi.json \
            || { echo "packages/contracts/openapi.json is stale. Run 'php artisan scramble:export --path=../../packages/contracts/openapi.json' in apps/studio and commit."; exit 1; }
      - name: Assert compiled mail templates are current
        working-directory: apps/studio
        run: |
          php artisan mail:build
          git diff --exit-code -- resources/views/vendor/mail \
            || { echo "Compiled mail templates are stale. Run 'php artisan mail:build' in apps/studio and commit the result."; exit 1; }

  web:
    needs: [changes, already-green]
    if: needs.changes.outputs.web == 'true' && needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose. package.json's packageManager field pins
      # the exact pnpm build, and action-setup errors out when a second source
      # also names one rather than picking a winner.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: [changes, already-green]
    if: needs.changes.outputs.e2e == 'true' && needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # E2eSeeder busts StudioSettingsResolver's redis-backed cache
      # (Cache::store('redis')->flush()) before seeding, the same
      # cross-process cache the `studio` job's redis service backs — this
      # job never had one, so that call had nowhere to connect and crashed
      # the webServer command it seeds for. .env.example's own REDIS_HOST
      # (127.0.0.1) already matches where a service container publishes to
      # on the runner, so no env override is needed below, same as `studio`.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, bcmath, gd, intl, pcntl
          coverage: none
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      # No version here on purpose. package.json's packageManager field pins
      # the exact pnpm build, and action-setup errors out when a second source
      # also names one rather than picking a winner.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studio/app build
      # mcp.spec.ts runs the MCP server as its own process (see the webServer
      # list in playwright.config.ts), and that process is dist/index.js.
      - run: pnpm --filter @studio/mcp build
      # Every database setting goes into .env rather than into this step's env.
      # Playwright starts `artisan serve` as a subprocess of a later step, and
      # that subprocess reads .env — so step-level DB_* variables reached the
      # migration but not the server, which then looked for a database named
      # by .env.example and got "does not exist". One source of truth, written
      # once, read by every process in the job.
      - working-directory: apps/studio
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=studio_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=studio/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=studio/' .env
          php artisan key:generate
          php artisan migrate --force
      - run: pnpm --filter @studio/app exec playwright install --with-deps chromium
      - working-directory: apps/studio
        env:
          APP_SURFACE: admin
        run: pnpm exec playwright test
