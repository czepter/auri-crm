name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same PR/branch. Pushes to main are never
# cancelled so every commit on the default branch keeps a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            php: &php
              - *ci
              - 'apps/studio/app/**'
              - 'apps/studio/bootstrap/**'
              - 'apps/studio/config/**'
              - 'apps/studio/database/**'
              - 'apps/studio/routes/**'
              - 'apps/studio/tests/**'
              - 'apps/studio/composer.json'
              - 'apps/studio/composer.lock'
              - 'apps/studio/phpunit.xml'
              - 'apps/studio/artisan'
              - 'apps/studio/.env.example'
              - 'apps/studio/resources/js/types/generated.d.ts'
            web: &web
              - *ci
              - 'apps/studio/resources/**'
              - 'apps/studio/public/**'
              - 'apps/studio/*.ts'
              - 'apps/studio/*.json'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            e2e:
              - *php
              - *web

  studio:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, bcmath, gd, intl
          coverage: none
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      - working-directory: apps/studio
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          ./vendor/bin/pest
      - name: Assert the generated TypeScript types are current
        working-directory: apps/studio
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/js/types/generated.d.ts \
            || { echo "Generated types are stale. Run 'php artisan typescript:transform' and commit."; exit 1; }

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, bcmath, gd, intl
          coverage: none
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studio/app build
      - working-directory: apps/studio
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
          APP_SURFACE: admin
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate
          php artisan migrate --force
      - run: pnpm --filter @studio/app exec playwright install --with-deps chromium
      - working-directory: apps/studio
        env:
          APP_SURFACE: admin
        run: pnpm exec playwright test
