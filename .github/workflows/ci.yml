name: CI

on:
  pull_request:
    branches: [main, dev]

# The default GITHUB_TOKEN grants contents:read only, and dorny/paths-filter
# asks the API which files a pull request touches — without pull-requests:read
# it fails with "Resource not accessible by integration", the changes job dies,
# and every test job silently skips on its `needs` output. A green checkmark
# over an untested pull request is worse than a red one.
permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Enforces docs/branching.md rules 2 and 4. Deliberately has no `needs`, so
  # it reports a verdict even while the test jobs are still running.
  branch-rules:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check the pull request base and head branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)
              case "$HEAD" in
                dev | hotfix/* | release/*) ;;
                *)
                  echo "::error::main only accepts dev, hotfix/* or release/*, but this pull request comes from '$HEAD'. Retarget it at dev."
                  exit 1
                  ;;
              esac
              ;;
            dev)
              case "$HEAD" in
                feat/* | feature/* | fix/* | bugfix/* | hotfix/* | chore/* | docs/* | refactor/* | ci/* | test/*) ;;
                *)
                  echo "::error::Branches merged into dev must be named <type>/<slug>, one of feat feature fix bugfix hotfix chore docs refactor ci test. Got '$HEAD'."
                  exit 1
                  ;;
              esac
              ;;
          esac
          echo "OK: $HEAD -> $BASE"

  changes:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      php: ${{ steps.filter.outputs.php }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
              - 'docker/app/Dockerfile'
            php: &php
              - *ci
              - 'apps/studio/app/**'
              - 'apps/studio/bootstrap/**'
              - 'apps/studio/config/**'
              - 'apps/studio/database/**'
              - 'apps/studio/routes/**'
              - 'apps/studio/tests/**'
              - 'apps/studio/composer.json'
              - 'apps/studio/composer.lock'
              - 'apps/studio/phpunit.xml'
              - 'apps/studio/artisan'
              - 'apps/studio/.env.example'
              - 'apps/studio/resources/js/types/generated.d.ts'
              - 'apps/studio/resources/mail/**'
              - 'apps/studio/resources/views/vendor/mail/**'
              # G-01: the committed OpenAPI document is derived from the api
              # surface's routes, so a hand-edit here — without the route
              # change that should have produced it — needs the same
              # drift check a php-only change already gets below.
              - 'packages/contracts/**'
            web: &web
              - *ci
              - 'apps/studio/resources/**'
              - 'apps/studio/public/**'
              - 'apps/studio/*.ts'
              - 'apps/studio/*.json'
              # G-08: the Astro gallery viewer, its own workspace package —
              # `pnpm -r --if-present <script>` (package.json's own lint/
              # test/build) already picks it up once pnpm sees it change.
              - 'apps/gallery/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            e2e:
              - *php
              - *web

  # studio, web and e2e run inside docker/app/Dockerfile's `ci` stage rather than
  # on the host: two runners share one host, and every apt-get and setup-php a
  # job ran there left state behind for the next one — a held apt lock failed
  # four attempts in a row, and a reboot mid-upgrade took libxml2 from the
  # host's PHP. The tag is the Dockerfile's hash plus the lockfile's
  # Playwright, so an image already in GHCR is reused as is. The gha build
  # cache cannot stand in for that: a pull request reads only its own ref's
  # entries and its base branch's, and ci.yml never runs on dev itself.
  ci-image:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      user: ${{ steps.tag.outputs.user }}
    steps:
      - uses: actions/checkout@v7
      # user: the jobs run as the runner's own uid. As root they would leave
      # root-owned files in the workspace the host jobs share, and the next
      # checkout there fails to clean them.
      - id: tag
        run: |
          pw=$(grep -m1 -oE "'@playwright/test@[0-9.]+'" pnpm-lock.yaml | grep -oE '[0-9.]+[0-9]')
          {
            echo "playwright=$pw"
            echo "image=ghcr.io/${{ github.repository }}/ci:$(sha256sum docker/app/Dockerfile | cut -c1-16)-pw$pw"
            echo "user=$(id -u):$(id -g)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pushed
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pushed.outputs.hit != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.pushed.outputs.hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: ci
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: PLAYWRIGHT_VERSION=${{ steps.tag.outputs.playwright }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

  studio:
    needs: [changes, ci-image]
    if: needs.changes.outputs.php == 'true'
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.ci-image.outputs.user }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # T-01's cross-process cache test is the first to need this: it proves
      # a setting changed by one StudioSettingsResolver instance is visible
      # to a completely fresh one through the redis cache store, which means
      # nothing unless a real Redis sits behind it.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # dest is per-job: concurrent jobs on the same self-hosted runner share
      # $HOME, and action-setup's default ~/setup-pnpm raced between them
      # (ENOTEMPTY/ENOENT installing pnpm's own binary).
      - uses: pnpm/action-setup@v6
        with:
          dest: ~/.setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @studio/app
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      - working-directory: apps/studio
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          ./vendor/bin/pest
      - name: Assert the generated TypeScript types are current
        working-directory: apps/studio
        run: |
          php artisan typescript:transform
          git diff --exit-code -- resources/js/types/generated.d.ts \
            || { echo "Generated types are stale. Run 'php artisan typescript:transform' and commit."; exit 1; }
      # G-01: packages/contracts/openapi.json is generated, never hand-edited
      # — Dedoc Scramble introspects the api surface's routes directly, so
      # regenerating it here and diffing against what's committed is the same
      # drift check the TypeScript types get above, for the same reason: a
      # contract nothing regenerated is a contract nobody can trust.
      - name: Assert the OpenAPI contract is current
        working-directory: apps/studio
        env:
          APP_SURFACE: api
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: studio_test
          DB_USERNAME: studio
          DB_PASSWORD: studio
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: |
          php artisan scramble:export --path=../../packages/contracts/openapi.json
          git diff --exit-code -- ../../packages/contracts/openapi.json \
            || { echo "packages/contracts/openapi.json is stale. Run 'php artisan scramble:export --path=../../packages/contracts/openapi.json' in apps/studio and commit."; exit 1; }
      - name: Assert compiled mail templates are current
        working-directory: apps/studio
        run: |
          php artisan mail:build
          git diff --exit-code -- resources/views/vendor/mail \
            || { echo "Compiled mail templates are stale. Run 'php artisan mail:build' in apps/studio and commit the result."; exit 1; }

  # In the ci image like studio and e2e: on the host, action-setup's
  # self-installer runs the runner's bundled npm, whose bin/npm no longer
  # finds ../lib/cli.js since runner 2.338.0.
  web:
    needs: [changes, ci-image]
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.ci-image.outputs.user }}
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose. package.json's packageManager field pins
      # the exact pnpm build, and action-setup errors out when a second source
      # also names one rather than picking a winner.
      # dest is per-job: concurrent jobs on the same self-hosted runner share
      # $HOME, and action-setup's default ~/setup-pnpm raced between them
      # (ENOTEMPTY/ENOENT installing pnpm's own binary).
      - uses: pnpm/action-setup@v6
        with:
          dest: ~/.setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: [changes, ci-image]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user ${{ needs.ci-image.outputs.user }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # E2eSeeder busts StudioSettingsResolver's redis-backed cache
      # (Cache::store('redis')->flush()) before seeding, the same
      # cross-process cache the `studio` job's redis service backs — this
      # job never had one, so that call had nowhere to connect and crashed
      # the webServer command it seeds for.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - working-directory: apps/studio
        run: composer install --no-interaction --prefer-dist
      # No version here on purpose. package.json's packageManager field pins
      # the exact pnpm build, and action-setup errors out when a second source
      # also names one rather than picking a winner.
      # dest is per-job: concurrent jobs on the same self-hosted runner share
      # $HOME, and action-setup's default ~/setup-pnpm raced between them
      # (ENOTEMPTY/ENOENT installing pnpm's own binary).
      - uses: pnpm/action-setup@v6
        with:
          dest: ~/.setup-pnpm-${{ github.job }}
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @studio/app build
      # Every database setting goes into .env rather than into this step's env.
      # Playwright starts `artisan serve` as a subprocess of a later step, and
      # that subprocess reads .env — so step-level DB_* variables reached the
      # migration but not the server, which then looked for a database named
      # by .env.example and got "does not exist". One source of truth, written
      # once, read by every process in the job.
      - working-directory: apps/studio
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=postgres/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=studio_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=studio/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=studio/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env
          sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env
          php artisan key:generate
          php artisan migrate --force
      - working-directory: apps/studio
        env:
          APP_SURFACE: admin
        run: pnpm exec playwright test
      # A missing baseline is written by the failing run. This is where it is
      # picked up: README.md, "Visual baselines".
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: |
            apps/studio/tests/e2e/visual.spec.ts-snapshots/
            apps/studio/test-results/
          if-no-files-found: ignore
