<!DOCTYPE html>
<html lang="de" data-theme="admin">
<head>
<meta charset="utf-8">
<title>03 · Anfrage anlegen — Nordlicht</title>
<link rel="stylesheet" href="../_shared/tokens.css">
<link rel="stylesheet" href="../_shared/admin-extra.css">
<script src="../_shared/layout.js"></script>
</head>
<body data-nav="anfragen" data-screen="3" data-depth="2">

<!-- Capture, not qualification. Five fields, because that is what exists at the
     moment an inquiry arrives: a name, an address, a subject, a date, and the
     text the client actually wrote. Everything else — package, venue, guest
     count, further shoots, budget — is read out of that text later, on the
     project. A form that asks for it now is a form that gets abandoned
     mid-phone-call, and half-entered leads are worse than terse ones.

     The date field is the primary shoot (Shoot.is_primary). No repeater here:
     vision §3.1's "optional repeater for additional shoots" was written for the
     public inquiry form, which is deferred. Taken by phone there is one date
     worth asking for, and further shoots are added on the project.

     CONFLICT DECISION: it warns, it never blocks. The check answers "is somebody
     already on this day", which is not the question "may this be saved". The
     studio breaks that rule deliberately — a second shooter leads the smaller
     job, two half-days fit one Saturday, the colliding date may still move or be
     lost. A blocking form also teaches staff to type a wrong date to get past
     it, which corrupts the shoots.date column the check reads. The flag renders
     under the field it concerns and travels with the lead onto the board. -->

<div class="app">
  <div data-sidebar></div>

  <main class="main">
    <div class="hrow">
      <div>
        <div class="kick">Neue Anfrage</div>
        <h1>Anfrage anlegen</h1>
      </div>
      <a class="txtbtn" href="02-anfragen.html">Abbrechen</a>
    </div>

    <div class="narrow">

      <div class="fgrid">
        <label class="fld wide">
          <span>Name</span>
          <input class="inp" type="text" value="Annika Steffens &amp; Ruben Falk">
        </label>

        <label class="fld wide">
          <span>E-Mail <em>optional</em></span>
          <input class="inp" type="email" value="annika.steffens@example.de">
          <span class="hint">Ohne Adresse kein Portal-Zugang und keine automatische Eingangsbestätigung.</span>
        </label>

        <label class="fld wide">
          <span>Betreff</span>
          <input class="inp" type="text" value="Hochzeit am 14.06.2026 — Anfrage Fotograf">
        </label>

        <label class="fld wide">
          <span>Datum</span>
          <input class="inp num" type="text" value="14.06.2026">
        </label>
      </div>

      <div class="flag">Haupttermin belegt — Meier &amp; Kowalski, Gut Basthorst · Christian, Nina</div>
      <span class="hint">Speichern ist trotzdem möglich.</span>

      <label class="fld wide" style="margin-top:var(--s5)">
        <span>Anfragetext</span>
        <textarea class="inp" rows="9">Hallo liebes Team von Atelier Nordlicht,

wir heiraten am 14. Juni 2026 auf Gut Basthorst und suchen noch eine Fotografin oder einen Fotografen für den ganzen Tag. Wir sind ungefähr 70 Gäste, die freie Trauung ist um 15 Uhr im Garten geplant, danach Sektempfang und abends Feier in der Scheune.

Uns gefallen eure Reportagebilder sehr — gestellte Gruppenfotos möchten wir eher wenige. Ein Verlobungsshooting im Frühjahr wäre auch schön, falls ihr so etwas anbietet.

Könnt ihr uns ein Angebot schicken? Gefunden haben wir euch über Freunde, die letztes Jahr bei euch waren.

Viele Grüße
Annika Steffens</textarea>
        <span class="hint">Wird vollständig gespeichert. Ort, Gästezahl, Paket und weitere Shootings später im Projekt ergänzen.</span>
      </label>

      <div class="formfoot">
        <a class="btn" href="02-anfragen.html">Anfrage anlegen</a>
        <a class="txtbtn" href="02-anfragen.html">Abbrechen</a>
      </div>

    </div>
  </main>
</div>

</body>
</html>
