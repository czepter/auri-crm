<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viola & Chris — 33 Bilder</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* Heute sind das zwei Seiten: ein Tor, das nach dem Passwort "Bilderübersicht
   noch nicht verfügbar" sagt, und ein Raster auf einem anderen Host, das
   niemand verlinkt. Hier ist es eine Seite — das Tor führt an genau die
   Stelle, an der die Bilder anfangen. */
body { background: var(--void); color: var(--void-ink); }

/* ── Titel ────────────────────────────────────────────────────────────── */
.cover { position: relative; height: 100svh; min-height: 560px; overflow: hidden; }
.cover > img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
.cover::after {
  content: ''; position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(12,10,9,.45) 0%, rgba(12,10,9,0) 26%),
    linear-gradient(0deg, var(--void) 0%, rgba(12,10,9,.35) 30%, rgba(12,10,9,0) 62%);
}
.covertext {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: var(--s9);
  max-width: var(--page); margin: 0 auto; padding-inline: var(--s5);
}
.covertext .eyebrow { color: rgba(246,241,235,.62); margin-bottom: var(--s4); }
.covertext .display { color: #fff; }
.covertext .meta { color: rgba(246,241,235,.8); margin-top: var(--s4); font-size: 15px; }

.scrollcue {
  position: absolute; z-index: 2; left: 50%; bottom: var(--s5); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  font: 600 10.5px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase;
  color: rgba(246,241,235,.5); text-decoration: none;
}
.scrollcue svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.4; animation: nudge 2.6s var(--ease) infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* ── Leiste ───────────────────────────────────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s5);
  max-width: var(--page); margin: 0 auto; padding: var(--s4) var(--s5);
  background: rgba(12,10,9,.72); backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--void-line);
}
.bar .who { font-size: 13.5px; color: var(--void-ink-2); }
.bar .who b { color: var(--void-ink); font-weight: 600; }
.bar .acts { display: flex; align-items: center; gap: var(--s3); }
.barbtn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: var(--r-pill);
  border: 1px solid var(--void-line); background: transparent;
  color: var(--void-ink); font: 500 13px/1 var(--sans); text-decoration: none; cursor: pointer;
  transition: background .2s var(--ease), border-color .2s var(--ease);
}
.barbtn:hover { background: var(--void-2); border-color: #3A3128; }
.barbtn.solid { background: #fff; color: var(--void); border-color: #fff; font-weight: 600; }
.barbtn.solid:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.barbtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }

/* ── Raster ───────────────────────────────────────────────────────────── */
/* Spalten statt Grid: ein Fotoraster will die Originalproportionen behalten,
   und `columns` ist die einzige Layoutmethode, die das ohne JS kann. */
.grid { max-width: var(--page); margin: 0 auto; padding: var(--s7) var(--s5) var(--s10); columns: 4; column-gap: var(--s3); }
.tile { position: relative; display: block; break-inside: avoid; margin-bottom: var(--s3); overflow: hidden; border-radius: 10px; background: var(--void-2); }
.tile img { width: 100%; transition: transform 1.2s var(--ease), opacity .4s var(--ease); }
.tile:hover img { transform: scale(1.03); }

/* Der Favoritenstern erscheint erst beim Hover — im Ruhezustand ist nichts
   zwischen dem Gast und dem Bild. */
.fav {
  position: absolute; top: 10px; right: 10px;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(12,10,9,.5); backdrop-filter: blur(8px);
  border: 0; cursor: pointer; color: #fff;
  opacity: 0; transform: scale(.9);
  transition: opacity .22s var(--ease), transform .22s var(--ease), background .2s var(--ease);
}
.tile:hover .fav, .fav.on { opacity: 1; transform: none; }
.fav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.fav.on { background: var(--accent); }
.fav.on svg { fill: currentColor; }

.gfoot {
  border-top: 1px solid var(--void-line);
  max-width: var(--page); margin: 0 auto; padding: var(--s7) var(--s5) var(--s8);
  display: flex; justify-content: space-between; gap: var(--s5); flex-wrap: wrap;
  font-size: 12.5px; color: var(--void-ink-2);
}
.gfoot a { text-decoration: none; }
.gfoot a:hover { color: var(--void-ink); }

@media (max-width: 1080px) { .grid { columns: 3; } }
@media (max-width: 760px) {
  .grid { columns: 2; padding-top: var(--s6); }
  .cover { height: 82svh; }
  .covertext { bottom: var(--s8); }
  .bar .who { display: none; }
}
</style>
</head>
