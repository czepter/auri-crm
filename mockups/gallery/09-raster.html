<!-- Past gate 1. The guest holds a gallery session and sees web-size images
     (vision §5). Four GallerySections, a sticky jump-nav, and a masonry column
     layout so portrait and landscape keep their real proportions rather than
     being cropped to a shared row height.

     Two tiles render the blurhash placeholder from §6 — the frame the browser
     paints before the photograph arrives, which is why the grid never jumps.

     Scope, per §5: forty tiles judge section navigation, format mixing and
     placeholder behaviour. They say nothing about whether 1500 images scroll
     well. That stays a P3 question; the caveat is stated once on the index
     rather than on the screen, so this page reads as product and not as a
     prototype apologising for itself. -->
